name: Signzy
kind: company
description: Signzy is a global identity verification, KYC, KYB and AML compliance
  platform founded in Bengaluru, India in 2015. Its API marketplace exposes 240+
  bespoke verification building blocks - document OCR, liveness and face match,
  deepfake detection, Aadhaar/PAN and other India checks, US ID and business
  verification, AML/sanctions/PEP screening, bank verification, Video KYC and
  Aadhaar eSign - behind a single token-authenticated REST API across India, the
  US, the Middle East and APAC.
