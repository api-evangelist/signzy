specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Signzy
providerId: signzy
created: '2026-07-17'
modified: '2026-07-17'
reconciled: false
tags:
- Identity Verification
- KYC
- Compliance
- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Signzy spend. Signzy bills on a per-verification (pay-per-check)
  basis under negotiated commercial agreements, metered by API call per product
  and region. Because list prices are not public, cost is driven by verification
  volume per product (identity, KYB, AML screening, bank verification) and by
  region-specific rate cards. Track spend by counting successful verifications
  per endpoint and per account/API key.
notes: >-
  Per-verification rates are quote-based and not publicly disclosed; verify with
  Signzy commercial terms during reconciliation.
sources:
- https://www.signzy.com/developer-page
- https://www.signzy.com/contact-us
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Signzy
serviceCategory: Identity and Compliance
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Signzy Verification API
  ServiceCategory: Identity and Compliance
  ProviderName: Signzy
  PublisherName: Signzy
  InvoiceIssuerName: Signzy Technologies
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: verifications
  description: Successful verification API calls, billed per check per product.
  unit: verifications
  aggregation: sum
  dimensions:
  - account
  - product
  - region
- name: video_kyc_sessions
  description: Assisted Video KYC sessions completed.
  unit: sessions
  aggregation: sum
  dimensions:
  - account
  - region
- name: esign_transactions
  description: Aadhaar eSign / eStamping transactions executed.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Count verifications per endpoint and per API key to map spend to workloads.
- name: Allocation
  description: Tag API keys per product line / region and map to internal cost centers.
- name: Optimization
  description: Route to the minimum-necessary check (e.g. database check before full document intelligence); avoid redundant re-verification.
- name: Accountability
  description: Assign owners per product/region; review verification volume monthly against budget.
maintainers:
